version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # wgpu and naga must move together: crates/wgpu pins naga to the wgpu version.
      wgpu:
        patterns: ["wgpu", "naga"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze must run the same version.
      codeql-action:
        patterns: ["github/codeql-action/*"]
