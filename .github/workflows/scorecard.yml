name: scorecard

# OpenSSF Scorecard of this repository. The result stays private (an artifact and
# the job summary); nothing is published to the Scorecard API or a badge.

on:
  schedule:
    - cron: "17 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard.json
          results_format: json
          publish_results: false
      - name: print the score
        run: |
          python3 -I - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("scorecard.json"))
          print("Scorecard", d["score"])
          for c in sorted(d["checks"], key=lambda c: c["score"]):
              print(c["score"], c["name"])
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: scorecard.json
