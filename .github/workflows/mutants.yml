name: mutants

# A mutant whose test run times out counts as caught (docs/mutation-testing.md).
# Mutation testing is a measurement, never a gate for merging, but a job turns
# red when it finds a missed mutant that docs/known-survivors.txt does not list
# (each listed one is explained in docs/mutation-testing.md), or, in a full
# run, when a listed one is now caught. The list only shrinks.
on:
  pull_request:
    paths: ["crates/**", "Cargo.toml", "Cargo.lock"]
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces its running mutants jobs.
concurrency:
  group: mutants-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Only the mutants that overlap the pull request's diff, split over four
  # runners so a kernel change finishes in minutes, not an hour. A shard with
  # nothing to do ends at once.
  diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-mutants@27.1.0
      - run: git diff "origin/$BASE_REF.." > pr.diff
        env:
          BASE_REF: ${{ github.base_ref }}
      # The GPU crate needs an adapter; its own job below runs it on software Vulkan.
      - run: |
          status=0
          cargo mutants --in-diff pr.diff --exclude 'crates/wgpu/**' --all-features --test-workspace true --shard ${{ matrix.shard }}/4 -j 2 --timeout-multiplier 5 --minimum-test-timeout 20 || status=$?
          # 0 clean, 3 only timeouts (they count as caught), 2 missed mutants
          # that the check below compares with docs/known-survivors.txt.
          case $status in 0|2|3) ;; *) exit "$status" ;; esac
      - run: python3 -I scripts/mutants_check.py 
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-diff-${{ matrix.shard }}
          path: mutants.out

  diff-gpu:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    env:
      OXFUSE_REQUIRE_ADAPTER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-mutants@27.1.0
      - run: git diff "origin/$BASE_REF.." > pr.diff
        env:
          BASE_REF: ${{ github.base_ref }}
      - run: |
          status=0
          cargo mutants --in-diff pr.diff -p oxfuse-wgpu --test-package oxfuse-wgpu -j 2 --timeout-multiplier 5 --minimum-test-timeout 20 || status=$?
          # 0 clean, 3 only timeouts (they count as caught), 2 missed mutants
          # that the check below compares with docs/known-survivors.txt.
          case $status in 0|2|3) ;; *) exit "$status" ;; esac
      - run: python3 -I scripts/mutants_check.py 
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-diff-gpu
          path: mutants.out

  # Every mutant of the CPU-side crates, one job per package: cargo-mutants builds
  # the baseline for the packages of the mutants it runs, so a feature of another
  # package (`oxfuse/wgpu`) cannot be named when only `oxfuse-core` is selected,
  # which broke the sharded form. The commands match `just mutants`
  # (docs/mutation-testing.md). A package that is too big for one two hour job
  # is split with `--shard k/n`, k counting from 0 (runtime: 6 jobs, about 80 mutants each, run in
  # parallel). The jobs fail on a mutant that is missed and
  # not listed in docs/known-survivors.txt, on a listed one that is now caught,
  # and on a failed baseline; they block nothing.
  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            args: "-p oxfuse-core"
            check: "--full --only crates/core/"
          - name: runtime-1
            args: "-p oxfuse-runtime --features parallel --shard 0/6"
            check: "--only crates/runtime/"
          - name: runtime-2
            args: "-p oxfuse-runtime --features parallel --shard 1/6"
            check: "--only crates/runtime/"
          - name: runtime-3
            args: "-p oxfuse-runtime --features parallel --shard 2/6"
            check: "--only crates/runtime/"
          - name: runtime-4
            args: "-p oxfuse-runtime --features parallel --shard 3/6"
            check: "--only crates/runtime/"
          - name: runtime-5
            args: "-p oxfuse-runtime --features parallel --shard 4/6"
            check: "--only crates/runtime/"
          - name: runtime-6
            args: "-p oxfuse-runtime --features parallel --shard 5/6"
            check: "--only crates/runtime/"
          - name: cli
            args: "-p oxfuse --features wgpu,onnx"
            check: "--full --only crates/cli/"
            gpu: true
          - name: onnx
            args: "-p oxfuse-onnx --test-package oxfuse-onnx"
            check: "--full --only crates/onnx/"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Only the cli job needs a GPU adapter (its gpu-selftest tests). Everywhere
      # else the wgpu tests skip without one: on the software adapter a full
      # test run takes minutes, which made the core and runtime jobs hit the
      # two hour limit.
      - if: matrix.gpu
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-mutants@27.1.0
      # An empty OXFUSE_REQUIRE_ADAPTER still counts as set, so the variable is
      # given to the gpu job only, through a step of its own.
      - if: matrix.gpu
        run: |
          status=0
          cargo mutants ${{ matrix.args }} --test-workspace true -j 2 --timeout-multiplier 5 --minimum-test-timeout 20 || status=$?
          case $status in 0|2|3) ;; *) exit "$status" ;; esac
        env:
          OXFUSE_REQUIRE_ADAPTER: "1"
      - if: ${{ !matrix.gpu }}
        run: |
          status=0
          cargo mutants ${{ matrix.args }} --test-workspace true -j 2 --timeout-multiplier 5 --minimum-test-timeout 20 || status=$?
          case $status in 0|2|3) ;; *) exit "$status" ;; esac
      - run: python3 -I scripts/mutants_check.py --self-test
      - run: python3 -I scripts/mutants_check.py ${{ matrix.check }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-full-${{ matrix.name }}
          path: mutants.out
