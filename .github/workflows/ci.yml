name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A pull request that changes only documentation skips the build matrix and
  # runs the few tests that read documents (the claims ledger, the readme and
  # docs checks). Anything else, including every push to main, runs everything:
  # a file is "documentation" only if it matches the allowlist below.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        run: |
          code=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
            echo "$files"
            other=$(echo "$files" | grep -vE '^(.*\.md|docs/.*|LICENSE|NOTICE)$' || true)
            if [ -z "$other" ]; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  docs:
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test -p oxfuse --locked --test claims --test docs --test readme --test op_coverage --test repo_hygiene

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Two arm64 runners besides the x86_64 ones: the hash sweep (`just exp-sweep`)
        # must come out the same on all five.
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just@1.59.0
      - run: just ci
      - run: just test-parallel
      - run: just exp-sweep
      - run: cargo run -q -p oxfuse-runtime --example optimize_and_run --locked
      - if: matrix.os == 'ubuntu-latest'
        run: just bench-check
      - name: gpu self-test report (a measurement, never a gate)
        if: matrix.os == 'macos-latest'
        run: |
          cargo run -q -p oxfuse --features wgpu --locked -- gpu-selftest || true
          cargo run -q -p oxfuse --features wgpu --locked -- gpu-selftest --limits downlevel || true

  msrv:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.89 --profile minimal
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just@1.59.0
      - run: just msrv

  # Runs the GPU tests on a software Vulkan device. A missing adapter fails the job
  # (OXFUSE_REQUIRE_ADAPTER) instead of letting the tests skip. This checks that
  # the shader text runs correctly on a second, independent implementation; it
  # says nothing about speed or about any hardware device.
  gpu:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OXFUSE_REQUIRE_ADAPTER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - run: cargo test -p oxfuse-wgpu --locked
      - run: cargo run --release -p oxfuse-wgpu --example matmul --locked
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just@1.59.0
      - run: just test-wgpu
      - name: gpu self-test report (a measurement, never a gate)
        run: |
          cargo run -q -p oxfuse --features wgpu --locked -- gpu-selftest
          cargo run -q -p oxfuse --features wgpu --locked -- gpu-selftest --limits downlevel

  # cargo-deny runs through its own action, not a justfile recipe, so it gets the
  # action's cache and advisory-db handling.
  deny:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
