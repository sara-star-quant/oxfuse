name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@1.59.0
      - run: just ci
      - run: just test-parallel
      - if: matrix.os == 'ubuntu-latest'
        run: just bench-check
      - name: gpu self-test report (a measurement, never a gate)
        if: matrix.os == 'macos-latest'
        run: |
          cargo run -q -p oxfuse --features wgpu --locked -- gpu-selftest || true
          cargo run -q -p oxfuse --features wgpu --locked -- gpu-selftest --limits downlevel || true

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.88 --profile minimal
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@1.59.0
      - run: just msrv

  # Runs the GPU tests on a software Vulkan device. A missing adapter fails the job
  # (OXFUSE_REQUIRE_ADAPTER) instead of letting the tests skip. This checks that
  # the shader text runs correctly on a second, independent implementation; it
  # says nothing about speed or about any hardware device.
  gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OXFUSE_REQUIRE_ADAPTER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - run: cargo test -p oxfuse-wgpu --locked
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@1.59.0
      - run: just test-wgpu
      - name: gpu self-test report (a measurement, never a gate)
        run: |
          cargo run -q -p oxfuse --features wgpu --locked -- gpu-selftest
          cargo run -q -p oxfuse --features wgpu --locked -- gpu-selftest --limits downlevel

  # Temporary: finds out which GPU test binary crashes the DX12 software adapter at
  # process exit. Runs each binary alone and prints exit codes. Remove once solved.
  windows-gpu-diagnostics:
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 40
    env:
      OXFUSE_WINDOWS_GPU_TESTS: "1"
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: each test binary alone, one thread
        shell: bash
        run: |
          set +e
          cargo test -p oxfuse-wgpu --no-run --locked
          for t in device_contract ops twin limits special_values sweep selftest model shaders_validate; do
            echo "=== $t (one thread)"
            cargo test -p oxfuse-wgpu --test $t --locked -- --test-threads=1 > out.txt 2>&1
            echo "exit=$?"
            grep -E "test result|STATUS_|panicked" out.txt | head -3
          done
          echo "=== lib"
          cargo test -p oxfuse-wgpu --lib --locked -- --test-threads=1 > out.txt 2>&1
          echo "exit=$?"
          grep -E "test result|STATUS_|panicked" out.txt | head -3
          exit 0
      - name: every device_contract test alone
        shell: bash
        run: |
          set +e
          exe=$(ls -t target/debug/deps/device_contract-*.exe | head -1)
          for name in $("$exe" --list 2>/dev/null | grep ': test$' | sed 's/: test$//'); do
            "$exe" --exact "$name" > out.txt 2>&1
            echo "exit=$? $name"
          done
          exit 0
      - name: matmul probe, one process per kernel configuration
        shell: bash
        run: |
          set +e
          cargo test -p oxfuse-wgpu --test windows_probe --no-run --locked
          exe=$(ls -t target/debug/deps/windows_probe-*.exe | head -1)
          for cfg in 16,1 8,1 4,1 2,1 1,1 16,2 8,2 16,4 8,4; do
            echo "=== probe $cfg"
            OXFUSE_PROBE=$cfg "$exe" --ignored --nocapture --exact probe_one_matmul_configuration 2>&1 | grep -E "^probe:|STATUS_|panicked" 
            echo "exit=${PIPESTATUS[0]}"
          done
          exit 0
      - name: raw shader probe, one process per construct
        shell: bash
        run: |
          set +e
          exe=$(ls -t target/debug/deps/windows_probe-*.exe | head -1)
          for name in F E A B C D; do
            echo "=== raw $name"
            OXFUSE_RAW=$name "$exe" --ignored --nocapture --exact probe_one_raw_shader 2>&1 | grep -E "^probe:|STATUS_|panicked"
            echo "exit=${PIPESTATUS[0]}"
          done
          exit 0
      - name: device_contract with default threads
        shell: bash
        run: |
          set +e
          cargo test -p oxfuse-wgpu --test device_contract --locked 2>&1 | tail -4
          echo "exit=${PIPESTATUS[0]}"
          exit 0
      - name: cli self-test (a short-lived process)
        shell: bash
        run: |
          set +e
          cargo run -q -p oxfuse --features wgpu --locked -- gpu-selftest
          echo "exit=$?"
          exit 0

  # cargo-deny runs through its own action, not a justfile recipe, so it gets the
  # action's cache and advisory-db handling.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
