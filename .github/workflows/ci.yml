name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@1.59.0
      - run: just ci
      - run: just test-parallel
      - if: matrix.os == 'ubuntu-latest'
        run: just bench-check
      - name: gpu self-test report (a measurement, never a gate)
        if: matrix.os == 'macos-latest'
        run: |
          cargo run -q -p oxfuse --features wgpu --locked -- gpu-selftest || true
          cargo run -q -p oxfuse --features wgpu --locked -- gpu-selftest --limits downlevel || true

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.88 --profile minimal
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@1.59.0
      - run: just msrv

  # Runs the GPU tests on a software Vulkan device. A missing adapter fails the job
  # (OXFUSE_REQUIRE_ADAPTER) instead of letting the tests skip. This checks that
  # the shader text runs correctly on a second, independent implementation; it
  # says nothing about speed or about any hardware device.
  gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OXFUSE_REQUIRE_ADAPTER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - run: cargo test -p oxfuse-wgpu --locked
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@1.59.0
      - run: just test-wgpu
      - name: gpu self-test report (a measurement, never a gate)
        run: |
          cargo run -q -p oxfuse --features wgpu --locked -- gpu-selftest
          cargo run -q -p oxfuse --features wgpu --locked -- gpu-selftest --limits downlevel

  # cargo-deny runs through its own action, not a justfile recipe, so it gets the
  # action's cache and advisory-db handling.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
