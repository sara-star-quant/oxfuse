name: fuzz

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [loader, differential, generated, onnx, onnx_generated, gpu_generated]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # gpu_generated compares every generated graph on a software Vulkan device
      # (lavapipe) with the reference; the other targets ignore it.
      - if: matrix.target == 'gpu_generated'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      # Keep what each run finds so the next one starts from it, not from the seed
      # graphs alone. This workflow never runs on a pull request, so a pull request
      # cannot write the cache it restores.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - run: rustup toolchain install nightly-2026-05-22 --profile minimal
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: just@1.59.0,cargo-fuzz@0.13.2
      - run: just fuzz ${{ matrix.target }} 300
        if: matrix.target != 'gpu_generated'
      - run: just fuzz gpu_generated 300
        if: matrix.target == 'gpu_generated'
        env:
          OXFUSE_REQUIRE_ADAPTER: "1"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts
