name: licence-scan

# Scans the repository for licences and copyright holders with ScanCode and
# checks the findings against scripts/licence_scan_check.py. Runs on release
# branches and on demand. The snippet scan (SCANOSS) is a local release step,
# `just licence-snippets`: its free API rate-limits hosted runners.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-') || startsWith(github.head_ref, 'licence-')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libmagic1
      # pluggy 1.5.0: ScanCode 32.5.0 does not start with newer pluggy releases.
      - run: python3 -m pip install "scancode-toolkit==32.5.0" "pluggy==1.5.0"
      - name: ScanCode (licences, copyrights)
        run: scancode --license --copyright --json-pp scancode.json --processes 2 --ignore ".git/*" .
      - run: python3 -I scripts/licence_scan_check.py scancode scancode.json | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licence-scan
          path: scancode.json
