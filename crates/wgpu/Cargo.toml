[package]
name = "oxfuse-wgpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories = ["artificial-intelligence", "mathematics", "hardware-support"]
description = "wgpu GPU backend for oxfuse tensor graphs (Vulkan, Metal, DX12) with a documented numerical contract and a self-test for any adapter."
readme = "README.md"
keywords = ["tensor", "gpu", "wgpu", "wgsl", "compute"]
exclude = ["tests"]

[dependencies]
oxfuse-core.workspace = true
oxfuse-runtime.workspace = true
wgpu.workspace = true
pollster.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
rayon.workspace = true
# The threaded CPU matmul, so the benchmark can compare against it.
oxfuse-runtime = { workspace = true, features = ["parallel"] }
# Same version as the front end wgpu runs, so the offline check validates what the device compiles.
naga = { version = "=30.0.1", features = ["wgsl-in"] }

[[bench]]
name = "gpu"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
