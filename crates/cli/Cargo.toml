[package]
name = "oxfuse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
exclude = ["tests"]
keywords = ["onnx", "tensor", "inference", "wgpu", "compiler"]
categories = ["command-line-utilities", "artificial-intelligence", "compilers"]
description = "Tensor graph compiler and runner: ONNX import, bit-exact CPU backends, optional wgpu GPU backend. Commands: check, run, inspect, gpu-selftest."

[lib]
name = "oxfuse_cli"
path = "src/lib.rs"

[[bin]]
name = "oxfuse"
path = "src/main.rs"

[dependencies]
oxfuse-core.workspace = true
oxfuse-runtime.workspace = true
oxfuse-wgpu = { workspace = true, optional = true }
oxfuse-onnx = { workspace = true, optional = true }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
insta.workspace = true

[features]
parallel = ["oxfuse-runtime/parallel"]
wgpu = ["dep:oxfuse-wgpu"]
onnx = ["dep:oxfuse-onnx"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
